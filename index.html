<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Head Company · DhiaScent</title>
<meta name="theme-color" content="#10231E">
<meta name="description" content="Pusat pemantauan syarikat Mama Dhia Trading untuk Founder dan Head Admin">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Head Co">
<style>
:root{
  --bg:#F5F4F0; --card:#FFFFFF; --ink:#14201C; --ink2:#3A4742; --muted:#6B7570; --line:#E4E2DA; --soft:#EFEDE6;
  --brand:#10231E; --brand2:#1B3A32; --brand-ink:#CFE0D8;
  --acc:#1F7A63; --acc-d:#155C4A; --acc-soft:#E3F1EB;
  --gold:#B8893A; --gold-soft:#F6EEDD;
  --ok:#1C7C45; --ok-bg:#E0F3E7; --warn:#9A5B07; --warn-bg:#FCEFD5; --bad:#B4321F; --bad-bg:#FBE3DE; --info:#2D5BC4; --info-bg:#E3EAFB; --mut-bg:#EEEDE8;
  --s1:#1F7A63; --s2:#B8893A; --s3:#7C8F88; --s4:#2D5BC4;
  --r:16px; --r-sm:10px;
  --sh:0 1px 2px rgba(20,32,28,.05),0 4px 14px rgba(20,32,28,.05);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px} .num{font-variant-numeric:tabular-nums}
.b{font-weight:650} .right{text-align:right} .nowrap{white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr;background:var(--card)}
.login-hero{background:var(--brand);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-hero:before{content:"";position:absolute;right:-140px;top:-140px;width:460px;height:460px;border-radius:50%;border:70px solid rgba(184,137,58,.10)}
.login-hero h1{font-size:42px;max-width:480px;margin-top:40px}
.login-hero p{color:var(--brand-ink);max-width:440px;font-size:16px}
.feat{display:grid;gap:12px;margin-top:28px;color:var(--brand-ink)}
.feat div{display:flex;gap:10px;align-items:center}.feat svg{color:#E3C27F}
.login-panel{display:grid;place-items:center;padding:32px 20px calc(32px + var(--sb))}
.login-box{width:100%;max-width:340px;text-align:center}
.brandrow{display:flex;align-items:center;gap:10px;font-weight:700}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#C99B4B,#9C7230);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.03em;flex:none}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:26px 0 8px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:block;transition:.15s}
.pin-dots i.on{background:var(--brand);border-color:var(--brand)}
.pin-err{min-height:22px;color:var(--bad);font-size:13px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.keypad button{height:64px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:24px;font-weight:600;cursor:pointer;transition:background .1s}
.keypad button:active{background:var(--soft)}
.keypad button.fn{font-size:14px;color:var(--muted);border-color:transparent;background:transparent}
.demo-note{margin-top:22px;padding:12px 14px;border-radius:12px;background:var(--gold-soft);color:#6B4F1E;font-size:13px;text-align:left}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--brand);color:var(--brand-ink);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;overflow:auto}
.side .brandrow{color:#fff;padding:4px 8px 18px}
.side .brandrow small{display:block;font-weight:500;color:var(--brand-ink);font-size:12px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--brand-ink);text-decoration:none;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-size:14.5px}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:var(--brand2);color:#fff;font-weight:600}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.side-foot .who{color:#fff;font-weight:600}
.main{min-width:0;padding:24px 28px 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:24px}
.top .sp{flex:1}
.mtop{display:none}
.bnav{display:none}

/* ---------- components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h3{font-size:15px;display:flex;align-items:center;gap:8px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h .sp{flex:1}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.stack{display:grid;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:var(--r-sm);font-weight:600;cursor:pointer;white-space:nowrap;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:active{transform:translateY(1px)} .btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand2)}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.wrap{white-space:normal;text-align:left;max-width:100%}
.btn.danger{color:var(--bad)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--mut-bg);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--info)} .chip.gold{background:var(--gold-soft);color:#7A5A20}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:8px;background:var(--acc)}
.bar.ok>i{background:var(--ok)} .bar.warn>i{background:#D08A1E} .bar.bad>i{background:var(--bad)}
.kpi-label{font-size:13px;color:var(--muted);font-weight:600}
.kpi-val{font-size:28px;font-weight:750;letter-spacing:-.02em;margin-top:4px}
.kpi-sub{font-size:13px;color:var(--muted);margin-top:4px}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.list{display:grid}
.list>*{min-width:0}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:2px}
.li .grow{flex:1;min-width:0}
.ttl{font-weight:600}
.seg{display:inline-flex;background:var(--mut-bg);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
select.inp,input.inp{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);font-size:14px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:14px;margin-bottom:16px}
.banner.gold{background:var(--gold-soft);color:#6B4F1E}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.info{background:var(--info-bg);color:#24448F}

/* hero */
.hero{background:var(--brand);color:#fff;border:0;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-80px;bottom:-110px;width:280px;height:280px;border-radius:50%;border:44px solid rgba(184,137,58,.12)}
.hero .kpi-label{color:#A9C3B8}
.hero .kpi-val{font-size:40px}
.hero .kpi-sub{color:#BFD3CA}
.tbar{height:12px;background:rgba(255,255,255,.12);border-radius:12px;position:relative;margin:18px 0 8px}
.tbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:12px;background:linear-gradient(90deg,#C99B4B,#E6C17A)}
.tbar .mk{position:absolute;top:-5px;bottom:-5px;width:2px;background:#fff;opacity:.8}
.tlab{display:flex;justify-content:space-between;font-size:12px;color:#A9C3B8}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;position:relative;z-index:1}
.hero-stats div{background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px}
.hero-stats b{display:block;font-size:17px}
.hero-stats span{font-size:12px;color:#A9C3B8}
.summary{font-size:15px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:12px 16px;margin-bottom:16px}

/* dept cards */
.dept{cursor:pointer;transition:transform .12s, box-shadow .12s;display:flex;flex-direction:column;gap:10px}
.dept:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(20,32,28,.08)}
.dept-top{display:flex;gap:12px;align-items:center}
.dept-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.dept-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.score{font-size:22px;font-weight:750}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;margin:0 -4px}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.stackbar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--soft)}
.stackbar i{display:block;height:100%}

/* report */
.rep{display:grid;gap:10px}
.rep-sec{font-size:14px}
.rep-sec b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.rep-sec p{margin:0;white-space:pre-wrap}
.cmts{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px}
.cmt{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:14px}
.cmt.f{background:var(--gold-soft)}
.cmt-in{display:flex;gap:8px}
.cmt-in input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px}

/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(16,24,22,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:560px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{flex:1;font-size:17px}
.modal-b{padding:18px 20px;overflow:auto}
.modal-f{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);justify-content:flex-end;padding-bottom:calc(14px + var(--sb))}
.modal-f .sp{flex:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.field{display:grid;gap:6px;margin-bottom:14px;grid-column:1/-1}
.field.half{grid-column:auto}
.field label{font-size:13px;font-weight:650;color:var(--ink2)}
.field .hint{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(31,122,99,.14)}
.field textarea{min-height:84px;resize:vertical}
.sheet-menu{display:grid;gap:4px}
.sheet-menu button{display:flex;gap:12px;align-items:center;padding:14px 12px;border:0;background:none;border-radius:12px;font-size:15px;cursor:pointer;text-align:left}
.sheet-menu button:active{background:var(--soft)}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sb));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100vw - 32px)}
.toast.bad{background:var(--bad)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.lnk{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--card)}
.lnk:hover{border-color:var(--acc)}
.lnk .lic{width:34px;height:34px;border-radius:10px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none}
.lnk .grow{min-width:0;flex:1}
.lnk .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.task{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.task:first-child{border-top:0}
.tick{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:#fff;cursor:pointer;padding:0}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tick.na{background:var(--mut-bg);border-color:var(--mut-bg);color:var(--muted)}
.tick:disabled{cursor:default}
.pic-row{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;padding:7px 0;font-size:14px}

/* ---------- responsive ---------- */
@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:900px){
  .login{grid-template-columns:1fr} .login-hero{display:none}
  .shell{display:block}
  .side{display:none}
  .main{padding:calc(70px + var(--st)) 14px calc(92px + var(--sb))}
  .top{margin-bottom:14px} .top h1{font-size:21px}
  .top .desk{display:none}
  .mtop{display:flex;position:fixed;top:0;left:0;right:0;z-index:20;background:var(--brand);color:#fff;padding:calc(10px + var(--st)) 14px 10px;align-items:center;gap:10px}
  .mtop .t{flex:1;font-weight:700;font-size:16px}
  .mtop .t small{display:block;font-size:11.5px;font-weight:500;color:var(--brand-ink)}
  .mtop .icon-btn{background:rgba(255,255,255,.08);border-color:transparent;color:#fff}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sb))}
  .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 0;cursor:pointer;position:relative}
  .bnav button.on{color:var(--brand);font-weight:700}
  .bnav button.on svg{stroke-width:2.2}
  .bnav .cnt{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;border-radius:10px;padding:0 5px;font-weight:700}
  .g2,.g21,.g3{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{padding:15px}
  .hero .kpi-val{font-size:34px}
  .kpi-val{font-size:22px}
  .ov{align-items:flex-end;padding:0}
  .toast{bottom:calc(84px + var(--sb))}
  .modal{border-radius:20px 20px 0 0;max-height:92vh}
  .fgrid{grid-template-columns:1fr}
  .field.half{grid-column:1/-1}
  .tbl.cards thead{display:none}
  .tbl.cards tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}
  .tbl.cards td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 2px;text-align:right}
  .tbl.cards td:before{content:attr(data-l);color:var(--muted);font-size:12.5px;text-align:left;font-weight:600}
  .tbl.cards td.full{display:block;text-align:left}
  .tbl.cards td.full:before{display:none}
  .hide-m{display:none!important}
}
@media (max-width:380px){ .hero-stats{grid-template-columns:1fr 1fr} .keypad button{height:58px} }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   HEAD COMPANY – Mama Dhia Trading (DhiaScent)
   Tukar DEFAULT_API kepada URL Web App Apps Script (/exec)
   supaya semua telefon terus bersambung tanpa perlu set.
   ========================================================= */
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbydUt_KRI-nETh2dCkpGrvaWTfUxeeB28sCKl-kMhcU1q7XelwUvNLfPaEO0ZdnAVaG/exec';
const APP_VER = '1.3.0';

/* ---------- storage (selamat) ---------- */
const MEM = {};
const LS = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? (k in MEM ? MEM[k] : d) : JSON.parse(v); } catch (e) { return k in MEM ? MEM[k] : d; } },
  set(k, v) { MEM[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { delete MEM[k]; try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { if (typeof v === 'number') return isFinite(v) ? v : 0; const n = Number(String(v || '').replace(/RM/gi, '').replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; };
const rm = (n, dp = 0) => 'RM' + Number(n || 0).toLocaleString('en-MY', { minimumFractionDigits: dp, maximumFractionDigits: dp });
const rmk = n => { n = Number(n || 0); return Math.abs(n) >= 1000 ? 'RM' + (n / 1000).toLocaleString('en-MY', { maximumFractionDigits: n >= 100000 ? 0 : 1 }) + 'k' : rm(n); };
const pct = (v, dp = 0) => (v == null || !isFinite(v)) ? '–' : (v * 100).toFixed(dp) + '%';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const BLN = ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ogo', 'Sep', 'Okt', 'Nov', 'Dis'];
const BLN_P = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => ymd(new Date());

async function api(action, payload = {}, pin = S.pin) {
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 45000);
  try {
    const res = await fetch(S.api, { method: 'POST', body: JSON.stringify(Object.assign({ action, pin }, payload)), signal: ctl.signal, redirect: 'follow' });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'Ralat pelayan');
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Sambungan terlalu lama. Cuba lagi.');
    if (e instanceof TypeError) throw new Error('Tiada sambungan ke pelayan. Semak internet atau URL Apps Script.');
    throw e;
  } finally { clearTimeout(to); }
}

function merge(table, row) {

function form({ title, fields, values = {}, onSave, onDelete, saveLabel = 'Simpan' }) {
  const fh = fields.map(f => {

    let inp;

    else if (f.t === 'textarea') inp = `<textarea name="${f.k}" ${f.req ? 'required' : ''} placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
    else if (f.t === 'hidden') inp = `<input name="${f.k}" type="hidden" value="">`;
    else inp = `<input name="${f.k}" type="${f.t || 'text'}" value="${esc(v)}" ${f.req ? 'required' : ''} ${f.t === 'number' ? 'step="any" inputmode="decimal"' : ''} ${f.t === 'pin' ? 'inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6"' : ''} placeholder="${esc(f.ph || '')}">`;

    const out = {}; fields.forEach(fl => out[fl.k] = f.elements[fl.k].value.trim());

  (S.data.Komitmen || []).filter(k => k.aktif !== 'Tidak').forEach(k => {
    if (k.mula && ym < k.mula) return;
    const ds = dueDays(k.hari, ym);
    if (!ds.length) { tanpa.push(k); return; }
    ds.forEach(d => { const due = ym + '-' + pad(d); const paid = (S.data.Bayaran || []).find(b => b.jenis === 'komitmen' && b.rujukanId === k.id && b.tempoh === due); rows.push({ jenis: 'komitmen', ref: k, nama: k.nama, penerima: k.penerima, kategori: k.kategori, jumlah: num(k.jumlah), due, paid }); });
  });
  (S.data.Hutang || []).forEach(h => { if (!h.due || h.due.slice(0, 7) !== ym) return; const inf = hutangInfo(h); rows.push({ jenis: 'hutang', ref: h, nama: h.keterangan || ('Hutang ' + h.pemiutang), penerima: h.pemiutang, kategori: 'Hutang · ' + h.kategori, jumlah: inf.selesai ? num(h.jumlah) : inf.baki, due: h.due, paid: inf.selesai ? (inf.bayar[inf.bayar.length - 1] || { tarikh: '' }) : null }); });
  rows.sort((a, b) => a.due.localeCompare(b.due) || a.nama.localeCompare(b.nama));
  return { rows, tanpa };
}
function dueStatus(r) {
  if (r.paid) return ['ok', 'Dibayar' + (r.paid.tarikh ? ' ' + fdateS(r.paid.tarikh) : '')];
  const d = daysBetween(todayStr(), r.due);
  if (d < 0) return ['bad', 'Lewat ' + (-d) + ' hari'];
  if (d === 0) return ['warn', 'Hari ini'];
  if (d <= 7) return ['gold', 'Dalam ' + d + ' hari'];
  return ['', 'Akan datang'];
}
function ringkasBayaran() {
  const cur = todayStr().slice(0, 7);
  const months = [addMonth(cur, -2), addMonth(cur, -1), cur, addMonth(cur, 1)];
  let all = []; months.forEach(m => all = all.concat(jadualBulan(m).rows));
  const today = todayStr();
  const lewat = all.filter(r => !r.paid && r.due < today);
  const minggu = all.filter(r => !r.paid && r.due >= today && daysBetween(today, r.due) <= 7);
  const hutangBaki = (S.data.Hutang || []).reduce((a, h) => a + hutangInfo(h).baki, 0);
  const bulanIni = jadualBulan(cur);
  return { lewat, minggu, hutangBaki, bulanIni, jumlahBulan: bulanIni.rows.reduce((a, r) => a + r.jumlah, 0), dibayarBulan: bulanIni.rows.filter(r => r.paid).reduce((a, r) => a + r.jumlah, 0) };

const isoD = x => x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate());
const addDays = (d, n) => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return isoD(x); };
const weekStart = d => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return isoD(x); };
function histDays() {
  const h = S.live?.hist || {};
  return Object.keys(h).sort().map(d => { const r = h[d] || []; return { d, t: num(r[0]), tt: num(r[1]), sh: num(r[2]), l: num(r[3]) }; });
}
function histAgg(mode) {
  const days = histDays(); const hb = S.live?.histBulan || {}; const G = {};
  const key = d => mode === 'minggu' ? weekStart(d) : mode === 'bulan' ? d.slice(0, 7) : d.slice(0, 4);
  const add = (k, r, n, ym) => {
    const g = G[k] = G[k] || { k, t: 0, tt: 0, sh: 0, l: 0, n: 0, bulanan: false, ms: new Set(), dari: null, hingga: null };
    g.t += r.t; g.tt += r.tt; g.sh += r.sh; g.l += r.l; g.n += n; g.ms.add(ym);
    return g;
  };
  days.forEach(r => { const g = add(key(r.d), r, 1, r.d.slice(0, 7)); if (!g.dari || r.d < g.dari) g.dari = r.d; if (!g.hingga || r.d > g.hingga) g.hingga = r.d; });
  if (mode !== 'minggu') Object.keys(hb).forEach(ym => {
    if (days.some(r => r.d.startsWith(ym))) return;
    const v = hb[ym] || []; const g = add(mode === 'bulan' ? ym : ym.slice(0, 4), { t: num(v[0]), tt: num(v[1]), sh: num(v[2]), l: num(v[3]) }, 0, ym);
    g.bulanan = true;
  });
  return Object.values(G).sort((a, b) => a.k.localeCompare(b.k));
}
function histChart(items, { every = 1, avg = null, h = 230 } = {}) {
  if (!items.length) return '<div class="empty">Tiada data</div>';
  const W = 720, H = h, pl = 48, pr = 8, pt = 12, pb = 26;
  const max = Math.max(...items.map(i => i.v), avg || 0) * 1.08 || 1;
  const raw = max / 4; const mag = Math.pow(10, Math.floor(Math.log10(raw))); const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= raw);
  const top = Math.ceil(max / step) * step;
  const y = v => pt + (H - pt - pb) * (1 - v / top); const bw = (W - pl - pr) / items.length;
  const kfmt = v => v >= 1e6 ? (v / 1e6).toFixed(1).replace('.0', '') + 'j' : v >= 1000 ? Math.round(v / 1000) + 'k' : v;
  let g = '';
  for (let v = 0; v <= top + 1e-6; v += step) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#ECEAE3"/><text x="${pl - 6}" y="${y(v) + 4}" font-size="11" fill="#7A847F" text-anchor="end">${kfmt(v)}</text>`;
  items.forEach((it, i) => {
    const w = Math.max(1.5, bw * .7), x = pl + i * bw + (bw - w) / 2;
    if (it.v > 0) g += `<rect x="${x}" y="${y(it.v)}" width="${w}" height="${y(0) - y(it.v)}" rx="${Math.min(3, w / 3)}" fill="${it.c || '#1F7A63'}" ${it.faded ? 'fill-opacity=".45"' : ''}><title>${esc(it.tip)}</title></rect>`;
    if (i % every === 0 || i === items.length - 1 && items.length <= 16) g += `<text x="${x + w / 2}" y="${H - 8}" font-size="11" fill="#7A847F" text-anchor="middle">${esc(it.lab)}</text>`;
  });
  if (avg) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(avg)}" y2="${y(avg)}" stroke="#B8893A" stroke-width="1.6" stroke-dasharray="5 4"/><text x="${W - pr}" y="${y(avg) - 5}" font-size="11" fill="#8A6524" text-anchor="end" font-weight="600">Purata ${rmk(avg)}</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Carta sales">${g}</svg></div>`;
}

function pnlRows() {

  Object.keys(P).forEach(k => { const p = P[k]; const bel = num(p.kosProduk) + num(p.ads) + num(p.belanjaLain); out[k] = { k, sales: num(p.sales), ads: num(p.ads), bel, untung: num(p.untung), src: 'pnl' }; });
  Object.keys(L.months || {}).forEach(k => { if (out[k]) return; const m = L.months[k]; if (!m.sales && !m.exp) return; out[k] = { k, sales: num(m.sales), ads: num(m.ads), bel: num(m.exp), untung: m.exp ? num(m.sales) - num(m.exp) : null, src: 'log' }; });
  return Object.values(out).sort((a, b) => a.k.localeCompare(b.k));
}

function execSummary(mm) {
  const js = S.data.Jabatan || []; const sc = js.map(deptScore);
  const ok = sc.filter(p => p != null && p >= .9).length, crit = sc.filter(p => p != null && p < .7).length;
  const parts = [];
  if (mm.sales) parts.push(`Sales ${mlabel(mm.cur).split(' ')[0]} setakat ${fdateS(mm.last)} ialah <b>${rm(mm.sales)}</b> (${pct(mm.sales / mm.tMin)} daripada minimum ${rmk(mm.tMin)}); unjuran akhir bulan <b>${rmk(mm.proj)}</b>.`);

    <nav class="bnav">${bnav().map(([k, l, i]) => `<button class="${S.view === k || (k === 'lagi' && LAGI().some(([x]) => x === S.view)) ? 'on' : ''}" data-go="${k}">${ic(i)}<span>${l}</span>${k === 'lagi' && (nIsu + nLewat) ? `<span class="cnt">${nIsu + nLewat}</span>` : ''}</button>`).join('')}</nav>
  </div>`;
  bindApp();
}

/* ======================= EVENTS ======================= */
function go(v) {
  if (v === 'lagi') {
    const o = modal('Menu', `<div class="sheet-menu">${LAGI().map(([k, l, i]) => `<button data-m="${k}">${ic(i)} ${l}</button>`).join('')}<button data-m="out" style="color:var(--bad)">${ic('out')} Log keluar</button></div>`);
    o.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { closeModal(); b.dataset.m === 'out' ? logout() : go(b.dataset.m); });
    return;
  }
  if (v !== 'jabatan') S.jab = null;
  S.view = v; try { history.replaceState(null, '', '#' + v); } catch (e) {}
  render(); window.scrollTo(0, 0);
}
function bindLogin() {
  let pin = '';
  const dots = () => { const n = Math.max(4, pin.length); $('#dots').innerHTML = Array.from({ length: n }, (_, i) => `<i class="${i < pin.length ? 'on' : ''}"></i>`).join(''); };
  const submit = async () => {
    if (pin.length < 4) { $('#pinErr').textContent = 'PIN sekurang-kurangnya 4 digit'; return; }
    $('#pinErr').innerHTML = '<span class="spin"></span>';
    try { await login(pin); S.view = (location.hash || '').slice(1) || 'utama'; if (!['utama', 'sales', 'kewangan', 'hutang', 'jabatan', 'projek', 'laporan', 'isu', 'pautan', 'tetapan'].includes(S.view)) S.view = 'utama'; render(); }
    catch (e) { $('#pinErr').textContent = e.message; pin = ''; dots(); }
  };
  const press = k => {
    if (k === 'clr') pin = pin.slice(0, -1);
    else if (k === 'ok') return submit();
    else if (pin.length < 6) pin += k;
    $('#pinErr').textContent = ''; dots();
    if (pin.length === 4 && !isCloud()) setTimeout(() => { if (pin.length === 4) submit(); }, 150);
  };
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => press(b.dataset.k));
  document.onkeydown = e => { if (S.user) return; if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('clr'); else if (e.key === 'Enter') press('ok'); };
}
function bindApp() {
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = e => { e.preventDefault(); if (b.dataset.pend) S.isuFilter = 'Menunggu sah'; go(b.dataset.go); if (b.dataset.margin) setTimeout(() => { const el = $('#marginSec'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 60); });
  ['#syncBtn', '#syncBtnM'].forEach(s => { const b = $(s); if (b) b.onclick = () => sync(true); });
  ['#logout', '#logout2'].forEach(s => { const b = $(s); if (b) b.onclick = logout; });
  document.querySelectorAll('[data-jab]').forEach(c => c.onclick = () => { S.view = 'jabatan'; S.jab = c.dataset.jab; render(); window.scrollTo(0, 0); });
  const on = (sel, fn) => document.querySelectorAll(sel).forEach(el => el.onclick = e => { e.preventDefault(); fn(el, e); });
  on('[data-kwm]', el => { S.kwMode = el.dataset.kwm; render(); });
  on('[data-kwmon]', el => { if (el.dataset.kwmon) { S.kwMode = 'hari'; S.kwMonth = el.dataset.kwmon; render(); } });
  const v = $('#mSel'); if (v) v.onchange = () => { S.salesMonth = v.value; render(); };
  const rf = $('#repF'); if (rf) rf.onchange = () => { S.repFilter = rf.value; render(); };
  on('#jabBack', () => { S.jab = null; render(); });
  bindHutang();
  on('[data-isuf]', el => { S.isuFilter = el.dataset.isuf; render(); });
  on('#addJab', () => jabForm());
  on('#editJab', () => jabForm(jabById(S.jab)));
  on('#addKpi', () => kpiForm({ jabatanId: S.jab }));
  on('[data-kpi]', el => kpiForm(S.data.KPI.find(k => k.id === el.dataset.kpi)));
  on('[data-addisu]', el => isuForm({ jabatanId: el.dataset.addisu || S.jab || '' }));
  on('[data-isu]', el => isuForm(S.data.Isu.find(i => i.id === el.dataset.isu)));
  on('[data-mohon]', el => { const i = S.data.Isu.find(x => x.id === el.dataset.mohon); form({ title: "Mohon pengesahan Dato'", values: i, saveLabel: 'Hantar untuk pengesahan', fields: [{ k: 'penyelesaian', l: 'Apa yang telah dibuat untuk selesaikan isu ini?', t: 'textarea', req: 1, hint: "Dato' akan baca ini sebelum sahkan." }], onSave: v => save('Isu', Object.assign({}, i, v, { status: PEND })) }); });
  on('[data-sah]', el => { const i = S.data.Isu.find(x => x.id === el.dataset.sah); form({ title: 'Sahkan isu selesai', values: {}, saveLabel: 'Sahkan selesai', fields: [{ k: 'catatanSah', l: 'Catatan (pilihan)', t: 'textarea', ph: 'cth: Ok, terima kasih' }], onSave: v => save('Isu', Object.assign({}, i, v, { status: 'Selesai', sahOleh: S.user.nama, sahTarikh: new Date().toISOString() })) }); });
  on('[data-tolak]', el => { const i = S.data.Isu.find(x => x.id === el.dataset.tolak); form({ title: 'Pulangkan untuk tindakan', values: {}, saveLabel: 'Pulangkan', fields: [{ k: 'catatanSah', l: 'Apa lagi yang perlu dibuat?', t: 'textarea', req: 1 }], onSave: v => save('Isu', Object.assign({}, i, v, { status: 'Dalam tindakan' })) }); });
  on('[data-addrep]', el => repForm({ jabatanId: el.dataset.addrep || S.user.jabatanId || '' }));
  on('[data-rep]', el => repForm(S.data.Laporan.find(r => r.id === el.dataset.rep)));
  on('#addProj', () => projForm({}));
  on('[data-proj]', el => projForm(S.live.projek.find(p => String(p.r) === el.dataset.proj)));
  on('[data-tick]', el => tick(el));
  on('#addLink', () => linkForm({}));
  on('[data-link]', el => linkForm(S.data.Pautan.find(p => p.id === el.dataset.link)));
  on('#addUser', () => userForm({}));
  on('[data-user]', el => userForm(S.data.Users.find(u => u.id === el.dataset.user)));
  on('#editTgt', () => tgtForm());
  on('#chgPin', () => pinForm());
  on('#instBtn', async () => { const p = window.__bip; if (!p) return; p.prompt(); try { await p.userChoice; } catch (e) {} window.__bip = null; render(); });
  on('#saveApi', async () => {
    const u = $('#apiUrl').value.trim();
    if (u && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) { toast('URL mesti bermula https://script.google.com/ dan berakhir /exec', true); return; }
    const old = S.api; S.api = u;
    if (!u) { LS.set('hc_api', ''); logout(); return; }
    try { toast('Menyambung…'); await login(S.pin); LS.set('hc_api', u); toast('Bersambung ke Google Sheet ✓'); render(); }
    catch (e) { S.api = old; toast(e.message.includes('PIN') ? 'Bersambung, tetapi PIN anda tiada dalam tab Users. Log masuk semula dengan PIN dari sheet.' : e.message, true); if (e.message.includes('PIN')) { LS.set('hc_api', u); S.api = u; logout(); } }
  });
  on('#clrApi', () => { S.api = ''; LS.set('hc_api', ''); logout(); });
  document.querySelectorAll('form[data-cmt]').forEach(f => f.onsubmit = async e => {
    e.preventDefault(); const inp = f.querySelector('input'); const t = inp.value.trim(); if (!t) return;
    inp.disabled = true;
    try { await save('Komen', { laporanId: f.dataset.cmt, penulis: S.user.nama, teks: t, dibuat: new Date().toISOString() }); }
    catch (er) { toast(er.message, true); inp.disabled = false; }
  });
  on('[data-delk]', async el => { if (await confirmBox('Padam komen ini?')) del('Komen', el.dataset.delk).catch(e => toast(e.message, true)); });
  const lq = $('#lq'); if (lq) lq.oninput = () => { const q = lq.value.toLowerCase(); document.querySelectorAll('[data-lnk]').forEach(x => x.style.display = x.dataset.lnk.includes(q) ? '' : 'none'); document.querySelectorAll('[data-cat]').forEach(c => c.style.display = [...c.querySelectorAll('[data-lnk]')].some(x => x.style.display !== 'none') ? '' : 'none'); };
}

/* ======================= FORMS ======================= */
const jabOpts = (only) => (S.data.Jabatan || []).filter(j => !only || j.id === only).map(j => [j.id, j.nama]);
function jabForm(j = {}) {
  form({ title: j.id ? 'Ubah jabatan' : 'Jabatan baru', values: j, fields: [
    { k: 'nama', l: 'Nama jabatan', req: 1 }, { k: 'pic', l: 'PIC / Ketua', req: 1, hint: 'Nama mesti sama seperti dalam Task Monitoring supaya tugasan dipadankan. Guna & untuk lebih seorang.' },
    { k: 'ikon', l: 'Ikon (emoji)', half: 1, d: '📁' }, { k: 'warna', l: 'Warna', t: 'color', half: 1, d: '#1F7A63' },
    { k: 'tugas', l: 'Skop tugas', t: 'textarea' }, { k: 'urutan', l: 'Susunan', t: 'number', half: 1, d: String((S.data.Jabatan || []).length + 1) }],
    onSave: v => save('Jabatan', Object.assign({}, j, v)),
    onDelete: j.id ? async () => { await del('Jabatan', j.id); S.jab = null; render(); } : null });
}
function kpiForm(k = {}) {
  const auto = [['manual', 'Manual (isi nilai semasa)'], ['sales_bulan', 'Auto · Sales bulan ini'], ['roi_bulan', 'Auto · ROI bulan ini'], ['exp_bulan', 'Auto · Perbelanjaan bulan ini'], ['founder_jam', 'Auto · Purata jam Live Founder'], ['host_perf', 'Auto · Performance host (%)'],
    ...Object.keys(S.live?.tugas?.minggu || {}).map(p => ['tugas:' + p, 'Auto · Tugasan harian ' + p + ' (%)'])];
  if (k.sumber && !auto.some(a => a[0] === k.sumber)) auto.push([k.sumber, srcLabel(k.sumber)]);
  form({ title: k.id ? 'Ubah KPI' : 'KPI baru', values: k, fields: [
    { k: 'jabatanId', l: 'Jabatan', t: 'select', o: jabOpts(role() === 'staf' ? S.user.jabatanId : null), req: 1 },
    { k: 'nama', l: 'Nama KPI', req: 1, ph: 'cth: Kes CS selesai dalam 24 jam' },
    { k: 'sumber', l: 'Sumber nilai', t: 'select', o: auto, d: 'manual' },
    { k: 'sasaran', l: 'Sasaran', t: 'number', req: 1, half: 1 }, { k: 'semasa', l: 'Nilai semasa (manual)', t: 'number', half: 1 },
    { k: 'unit', l: 'Unit', t: 'select', o: [['%', '%'], ['RM', 'RM'], ['x', 'kali (x)'], ['jam', 'jam'], ['orang', 'orang'], ['unit', 'unit'], ['kes', 'kes'], ['', 'tiada']], half: 1 },
    { k: 'arah', l: 'Lebih baik jika', t: 'select', o: [['naik', 'Lebih tinggi'], ['turun', 'Lebih rendah']], half: 1 }],
    onSave: v => save('KPI', Object.assign({}, k, v, { kemaskini: new Date().toISOString() })),
    onDelete: k.id ? () => del('KPI', k.id) : null });
}
function isuForm(i = {}) {
  const isNew = !i.id;
  form({ title: isNew ? (role() === 'founder' ? 'Arahan / isu baru' : 'Isu baru') : 'Ubah isu', values: Object.assign({ tarikh: todayStr(), status: 'Terbuka', tahap: 'Sederhana' }, i), fields: [
    { k: 'jabatanId', l: 'Jabatan', t: 'select', o: jabOpts(role() === 'staf' ? S.user.jabatanId : null), req: 1 },
    { k: 'tajuk', l: role() === 'founder' && isNew ? 'Arahan / isu' : 'Isu', t: 'textarea', req: 1 },
    { k: 'tahap', l: 'Tahap', t: 'select', o: ['Tinggi', 'Sederhana', 'Rendah'], half: 1 }, { k: 'status', l: 'Status', t: 'select', o: role() === 'founder' ? ['Terbuka', 'Dalam tindakan', PEND, 'Selesai'] : (i.status === 'Selesai' ? ['Selesai', 'Terbuka', 'Dalam tindakan'] : ['Terbuka', 'Dalam tindakan', PEND]), half: 1, hint: role() === 'founder' ? '' : "Hanya Dato' / Datin boleh tandakan Selesai." },
    { k: 'pic', l: 'PIC', half: 1 }, { k: 'tarikh', l: 'Tarikh', t: 'date', half: 1 },
    { k: 'tindakan', l: 'Tindakan seterusnya', t: 'textarea' }, { k: 'penyelesaian', l: 'Penyelesaian (apa yang telah dibuat)', t: 'textarea' }],
    onSave: v => save('Isu', Object.assign({}, i, v, isNew ? { dibuat: new Date().toISOString() } : {})),
    onDelete: !isNew && (isAdmin()) ? () => del('Isu', i.id) : null });
}
function repForm(r = {}) {
  const isNew = !r.id;
  form({ title: isNew ? 'Hantar laporan' : 'Ubah laporan', values: Object.assign({ tarikh: todayStr(), jenis: 'Harian', status: 'Lancar' }, r), saveLabel: isNew ? 'Hantar' : 'Simpan', fields: [
    { k: 'jabatanId', l: 'Jabatan', t: 'select', o: jabOpts(role() === 'staf' ? S.user.jabatanId : null), req: 1 },
    { k: 'jenis', l: 'Jenis', t: 'select', o: ['Harian', 'Mingguan', 'Bulanan'], half: 1 }, { k: 'tarikh', l: 'Tarikh', t: 'date', half: 1 },
    { k: 'status', l: 'Status keseluruhan', t: 'select', o: ['Lancar', 'Ada halangan', 'Kritikal'] },
    { k: 'pencapaian', l: 'Pencapaian', t: 'textarea', req: 1, ph: 'Apa yang siap / dicapai' },
    { k: 'isu', l: 'Isu / halangan', t: 'textarea', ph: 'Kosongkan jika tiada' },
    { k: 'rancangan', l: 'Rancangan seterusnya', t: 'textarea' }],
    onSave: v => save('Laporan', Object.assign({}, r, v, isNew ? { penulis: S.user.nama, dibuat: new Date().toISOString() } : {})),
    onDelete: !isNew ? () => del('Laporan', r.id) : null });
}
function projForm(p = {}) {
  form({ title: p.r ? 'Ubah projek' : 'Projek baru', values: p, fields: [
    { k: 'projek', l: 'Nama projek', req: 1 }, { k: 'pic', l: 'PIC', half: 1, d: 'Founder & Amira' },
    { k: 'status', l: 'Status', t: 'select', o: ['Belum mula', 'Sedang berjalan', 'Tertangguh', 'Siap'], half: 1, d: 'Sedang berjalan' },
    { k: 'progress', l: 'Progress', half: 1, ph: 'cth: 50%' }, { k: 'due', l: 'Due date', t: 'date', half: 1 },
    { k: 'langkah', l: 'Langkah seterusnya', t: 'textarea' }, { k: 'catatan', l: 'Catatan', t: 'textarea' }],
    onSave: async v => {
      if (v.progress && !/%$/.test(v.progress)) v.progress = num(v.progress) + '%';
      const row = Object.assign({}, p, v);
      if (isCloud()) { const j = await api('projek', { row }); row.r = j.projek.r; }
      else row.r = row.r || (Math.max(1, ...S.live.projek.map(x => x.r)) + 1);
      const i = S.live.projek.findIndex(x => x.r === row.r); if (i >= 0) S.live.projek[i] = row; else S.live.projek.push(row);
      persist(); render();
    } });
}
async function tick(el) {
  const r = +el.dataset.tick; const t = (S.live.tugas?.hari || []).find(x => x.r === r); if (!t) return;
  const next = t.status === 'Siap' ? 'Belum' : 'Siap'; const prev = t.status;
  t.status = next; render();
  try { if (isCloud()) await api('tugas', { row: { r, status: next } }); persist(); }
  catch (e) { t.status = prev; render(); toast(e.message, true); }
}
function linkForm(p = {}) {
  const cats = [...new Set((S.data.Pautan || []).map(x => x.kategori))];
  form({ title: p.id ? 'Ubah pautan' : 'Pautan baru', values: p, fields: [
    { k: 'tajuk', l: 'Tajuk', req: 1 }, { k: 'url', l: 'URL', t: 'url', req: 1, ph: 'https://' },
    { k: 'kategori', l: 'Kategori', t: 'select', o: cats.length ? cats : ['Lain-lain'], half: 1 }, { k: 'urutan', l: 'Susunan', t: 'number', half: 1, d: String((S.data.Pautan || []).length + 1) },
    { k: 'nota', l: 'Nota ringkas' }],
    onSave: v => save('Pautan', Object.assign({}, p, v)), onDelete: p.id ? () => del('Pautan', p.id) : null });
}
function userForm(u = {}) {
  form({ title: u.id ? 'Ubah pengguna' : 'Pengguna baru', values: Object.assign({ aktif: 'Ya', peranan: 'staf' }, u, { pin: '' }), fields: [
    { k: 'nama', l: 'Nama', req: 1, hint: 'Untuk staf, guna nama sama seperti PIC dalam Task Monitoring (cth: Ayuni).' },
    { k: 'peranan', l: 'Peranan', t: 'select', o: [['founder', 'Founder'], ['admin', 'Head Admin'], ['staf', 'Staf / Ketua jabatan']], half: 1 },
    { k: 'jabatanId', l: 'Jabatan', t: 'select', o: jabOpts(), half: 1 },
    { k: 'pin', l: u.id ? 'PIN baru (kosongkan jika tak tukar)' : 'PIN (4–6 digit)', t: 'pin', req: !u.id, half: 1 },
    { k: 'aktif', l: 'Status', t: 'select', o: [['Ya', 'Aktif'], ['Tidak', 'Tidak aktif']], half: 1 }],
    onSave: v => { const row = Object.assign({}, u, v); if (!v.pin) delete row.pin; if (!u.id && !v.pin) throw new Error('PIN diperlukan'); return save('Users', row); },
    onDelete: u.id && u.id !== S.user.id ? () => del('Users', u.id) : null });
}
function tgtForm() {
  form({ title: 'Sasaran syarikat', values: { nama: T('nama', 'Mama Dhia Trading'), target_min: T('target_min', 300000), target: T('target', 500000), roi: T('roi', 7), break_even: T('break_even', 211000), kempen: T('kempen', '') }, fields: [
    { k: 'nama', l: 'Nama syarikat' }, { k: 'target_min', l: 'Sales minimum sebulan (RM)', t: 'number', half: 1 }, { k: 'target', l: 'Target sebulan (RM)', t: 'number', half: 1 },
    { k: 'roi', l: 'ROI sasaran', t: 'number', half: 1 }, { k: 'break_even', l: 'Break-even sebulan (RM)', t: 'number', half: 1 },
    { k: 'kempen', l: 'Kempen semasa', t: 'textarea', hint: 'Dipaparkan di skrin Utama untuk Founder.' }],
    onSave: async v => { for (const [k, val] of Object.entries(v)) await save('Tetapan', { id: k, nilai: val }); } });
}
function pinForm() {
  form({ title: 'Tukar PIN', fields: [{ k: 'pin', l: 'PIN baru (4–6 digit)', t: 'pin', req: 1 }, { k: 'pin2', l: 'Ulang PIN baru', t: 'pin', req: 1 }],
    onSave: async v => {
      if (v.pin !== v.pin2) throw new Error('PIN tidak sama');
      if (isCloud()) { await api('pin', { baru: v.pin }); }
      else { if (S.data.Users.some(u => u.pin === v.pin && u.id !== S.user.id)) throw new Error('PIN sudah digunakan'); merge('Users', { id: S.user.id, pin: v.pin }); LS.set('hc_demo', S.data); }
      S.pin = v.pin; S.user.pin = v.pin; LS.set('hc_pin', v.pin); persist();
    } });
}

/* ======================= BOOT ======================= */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__bip = e; if (S.view === 'tetapan') render(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (S.user && h && h !== S.view && NAV.some(n => n[0] === h)) go(h); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.user && isCloud() && S.lastSync && Date.now() - new Date(S.lastSync).getTime() > 5 * 60 * 1000) sync(false); });
(function boot() {
  const c = LS.get('hc_cache');
  if (S.pin && c && c.user) {
    S.user = c.user; S.data = c.data; S.live = c.live; S.lastSync = c.t;
    const h = (location.hash || '').slice(1); if (NAV.some(n => n[0] === h)) S.view = h;
    if (!isCloud()) { S.data = LS.get('hc_demo') || S.data || demoData(); S.live = demoLive(); }
    render();
    if (isCloud()) sync(false);
  } else render();
  try { if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|claudeusercontent/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
})();
</script>
